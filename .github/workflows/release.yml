name: Release Windows Binaries

on:
  push:
    tags:
      - "tdl-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. tdl-v0.2.0)"
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    name: Build Windows (amd64)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-amd64-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: windows-amd64-cargo-

      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build
        run: cargo tauri build --target x86_64-pc-windows-msvc --bundles msi,nsis

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          VER="${TAG#tdl-v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "ver=${VER}" >> "$GITHUB_OUTPUT"

      - name: Collect artifacts
        shell: bash
        run: |
          VER="${{ steps.ver.outputs.ver }}"
          mkdir -p dist

          # CLI binary
          cp target/x86_64-pc-windows-msvc/release/tdl.exe dist/tdl.exe
          cd dist && 7z a "tdl_${VER}_windows_amd64.zip" tdl.exe && rm tdl.exe && cd ..

          # MSI installer
          find target/x86_64-pc-windows-msvc/release/bundle/msi -name "*.msi" | head -1 | \
              xargs -I{} cp {} "dist/tdl_${VER}_windows_amd64.msi"

          # NSIS installer
          find target/x86_64-pc-windows-msvc/release/bundle/nsis -name "*.exe" | head -1 | \
              xargs -I{} cp {} "dist/tdl_${VER}_windows_amd64-setup.exe"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tdl-windows-amd64
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to Release
    needs: build-windows
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      PUBLIC_RELEASE_REPO: ${{ vars.PUBLIC_RELEASE_REPO }}
      PUBLIC_RELEASE_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
    steps:
      - name: Validate secrets
        run: |
          [ -z "$PUBLIC_RELEASE_REPO" ]  && echo "PUBLIC_RELEASE_REPO not set"  && exit 1
          [ -z "$PUBLIC_RELEASE_TOKEN" ] && echo "PUBLIC_RELEASE_TOKEN not set" && exit 1
          echo "ok"

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          [[ "$TAG" =~ ^v ]] && TAG="tdl-${TAG}"
          echo "value=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: tdl-windows-amd64
          path: dist/

      - name: Publish
        env:
          GH_TOKEN: ${{ env.PUBLIC_RELEASE_TOKEN }}
          TAG: ${{ steps.tag.outputs.value }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --repo "$PUBLIC_RELEASE_REPO" &>/dev/null; then
              gh release create "$TAG" \
                  --repo "$PUBLIC_RELEASE_REPO" \
                  --title "$TAG" \
                  --notes "See release notes."
          fi
          gh release upload "$TAG" dist/* \
              --repo "$PUBLIC_RELEASE_REPO" \
              --clobber
