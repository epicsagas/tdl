name: Release Public Binaries

on:
  push:
    tags:
      - "v*"
      - "tdl-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release to public repository (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            os_name: darwin
            arch: arm64
            bundles: app,dmg
          - os: macos-13
            target: x86_64-apple-darwin
            os_name: darwin
            arch: amd64
            bundles: app,dmg
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            os_name: linux
            arch: amd64
            bundles: deb,appimage
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            os_name: linux
            arch: arm64
            bundles: deb,appimage
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            os_name: windows
            arch: amd64
            bundles: msi,nsis
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2" --locked

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          VER="${TAG#tdl-v}"
          VER="${VER#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "ver=${VER}" >> "$GITHUB_OUTPUT"

      - name: Build (Tauri)
        run: cargo tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Collect artifacts (macOS)
        if: matrix.os_name == 'darwin'
        shell: bash
        run: |
          VER="${{ steps.version.outputs.ver }}"
          mkdir -p dist
          # DMG
          find target/${{ matrix.target }}/release/bundle/dmg -name "*.dmg" | while read f; do
            cp "$f" "dist/tdl_${VER}_${{ matrix.os_name }}_${{ matrix.arch }}.dmg"
          done

      - name: Collect artifacts (Linux)
        if: matrix.os_name == 'linux'
        shell: bash
        run: |
          VER="${{ steps.version.outputs.ver }}"
          mkdir -p dist
          find target/${{ matrix.target }}/release/bundle/deb -name "*.deb" | while read f; do
            cp "$f" "dist/tdl_${VER}_${{ matrix.os_name }}_${{ matrix.arch }}.deb"
          done
          find target/${{ matrix.target }}/release/bundle/appimage -name "*.AppImage" | while read f; do
            cp "$f" "dist/tdl_${VER}_${{ matrix.os_name }}_${{ matrix.arch }}.AppImage"
          done

      - name: Collect artifacts (Windows)
        if: matrix.os_name == 'windows'
        shell: bash
        run: |
          VER="${{ steps.version.outputs.ver }}"
          mkdir -p dist
          find target/${{ matrix.target }}/release/bundle/msi -name "*.msi" | while read f; do
            cp "$f" "dist/tdl_${VER}_${{ matrix.os_name }}_${{ matrix.arch }}.msi"
          done
          find target/${{ matrix.target }}/release/bundle/nsis -name "*.exe" | while read f; do
            cp "$f" "dist/tdl_${VER}_${{ matrix.os_name }}_${{ matrix.arch }}-setup.exe"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tdl-${{ matrix.os_name }}-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to Public Repo
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      PUBLIC_RELEASE_REPO: ${{ vars.PUBLIC_RELEASE_REPO }}
      PUBLIC_RELEASE_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
    steps:
      - name: Validate required configuration
        run: |
          if [ -z "${PUBLIC_RELEASE_REPO}" ]; then
            echo "PUBLIC_RELEASE_REPO is not set (repo variable)."
            exit 1
          fi
          if [ -z "${PUBLIC_RELEASE_TOKEN}" ]; then
            echo "PUBLIC_RELEASE_TOKEN is not set (repo secret)."
            exit 1
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded-artifacts
          merge-multiple: true

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create checksums
        run: |
          cd downloaded-artifacts
          find . -type f ! -name "SHA256SUMS.txt" -print0 | sort -z | xargs -0 shasum -a 256 > SHA256SUMS.txt

      - name: Publish release to public repository
        env:
          GH_TOKEN: ${{ env.PUBLIC_RELEASE_TOKEN }}
          RELEASE_TAG: ${{ steps.tag.outputs.value }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$PUBLIC_RELEASE_REPO" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists in $PUBLIC_RELEASE_REPO"
          else
            gh release create "$RELEASE_TAG" \
              --repo "$PUBLIC_RELEASE_REPO" \
              --title "$RELEASE_TAG" \
              --notes "Automated binary release from private source repository."
          fi

          mapfile -t FILES < <(find downloaded-artifacts -type f | sort)
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "No files found to upload."
            exit 1
          fi

          gh release upload "$RELEASE_TAG" "${FILES[@]}" \
            --repo "$PUBLIC_RELEASE_REPO" \
            --clobber
