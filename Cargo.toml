[package]
name = "tdl"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
reqwest = { version = "0.13", features = ["json", "stream", "form", "query", "gzip", "deflate", "brotli"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
indicatif = "0.18"
anyhow = "1"
thiserror = "2"
base64 = "0.22"
aes = "0.9"
cbc = "0.2"
ctr = "0.10"
sha2 = "0.11"
lofty = "0.24"
m3u8-rs = "6"
quick-xml = "0.39"
dirs = "6"
url = "2"
regex = "1"
rand = "0.10"
tokio-util = { version = "0.7", features = ["io"] }
futures = "0.3"
hex = "0.4"
inquire = "0.9"
opener = { version = "0.8", optional = true }
ratatui = "0.30"
crossterm = "0.29"

[build-dependencies]
tauri-build = { version = "2", optional = true }

[dependencies.tauri]
version = "2"
features = ["native-tls"]
optional = true

[features]
default = ["gui"]
gui = ["tauri", "tauri-build", "opener"]
